<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול מלאי רכבים - מגרש רכבים</title>
    <!-- טעינת Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-3xl mx-auto my-10 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="flex justify-between items-center mb-8 pb-4 border-b">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">הוספת רכב חדש למלאי</h1>
                <p class="text-gray-500 text-sm mt-1">המכונית תופיע מיד בקטלוג הציבורי ללקוחות</p>
            </div>
            <a href="#" class="text-blue-600 hover:underline text-sm font-medium"><i class="fa-solid fa-arrow-right ml-1"></i> חזרה ללוח בקרה</a>
        </div>

        <form id="carForm" class="space-y-6">
            
            <!-- פרטי הרכב הבסיסיים -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">יצרן ודגם</label>
                    <input type="text" id="carModel" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: מאזדה 3">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שנת ייצור</label>
                    <input type="number" id="carYear" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: 2022">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">מחיר (בשקלים)</label>
                    <input type="number" id="carPrice" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: 75000">
                </div>
            </div>

            <!-- נתונים נוספים -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">קילומטראז'</label>
                    <input type="number" id="carKm" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: 45000">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">תיבת הילוכים</label>
                    <select id="carGear" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                        <option value="אוטומט">אוטומט</option>
                        <option value="ידני">ידני</option>
                        <option value="חשמלי/היברידי">חשמלי / היברידי</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">צבע</label>
                    <input type="text" id="carColor" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: לבן מטאלי">
                </div>
            </div>

            <!-- תמונת הרכב -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">קישור לתמונה של הרכב (URL)</label>
                <input type="url" id="carImage" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="https://example.com/car.jpg">
                <p class="text-xs text-gray-400 mt-1">בהמשך נחבר את זה להעלאת קבצים ישירות מהמכשיר</p>
            </div>

            <!-- הערות נוספות -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">תיאור ומצב הרכב</label>
                <textarea id="carNotes" rows="3" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: יד ראשונה פרטית, מטופל במוסך מורשה, ללא תאונות..."></textarea>
            </div>

            <!-- כפתור הוספה -->
            <div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md">
                    <i class="fa-solid fa-plus ml-2"></i> פרסם רכב למלאי
                </button>
            </div>

        </form>
    </div>

    <script>
        document.getElementById('carForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const model = document.getElementById('carModel').value;
            const year = document.getElementById('carYear').value;
            const price = document.getElementById('carPrice').value;

            alert(`הידד! הרכב ${model} (שנת ${year}) בסך ${price} ₪ נוסף בהצלחה למלאי ומוצג כעת באתר.`);
            
            // איפוס הטופס לאחר הוספה
            this.reset();
        });
    </script>

</body>
</html>
