<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות סוכנים - Car Finance Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // הגדרת מצב כהה מבוסס מחלקה עבור Tailwind
        tailwind.config = {
            darkMode: 'class',
        }
        // טעינה מוקדמת של העדפת המשתמש למניעת הבהוב
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">

    <header class="w-full p-4 flex justify-between items-center max-w-4xl mx-auto">
        <a href="index.html" class="text-xs text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition flex items-center gap-1">
            <i class="fa-solid fa-arrow-right"></i> חזרה לקטלוג הציבורי
        </a>
        
        <div class="flex items-center gap-2">
            <!-- כפתור מצב כהה/בהיר -->
            <button onclick="toggleDarkMode()" class="bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-3 py-2 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                <i id="themeIcon" class="fa-solid fa-moon"></i>
                <span id="themeText">מצב כהה</span>
            </button>

            <button onclick="openAdminModal()" class="bg-gray-900 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-900 dark:hover:bg-gray-200 text-white px-4 py-2 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-1.5 cursor-pointer">
                <i class="fa-solid fa-shield-halved"></i> כניסת מנהל ראשי (אדמין)
            </button>
        </div>
    </header>

    <main class="flex items-center justify-center px-4 flex-1">
        <div class="max-w-md w-full bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 text-center transition-colors duration-200">
            
            <div class="w-16 h-16 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fa-solid fa-store"></i>
            </div>

            <h1 class="text-xl font-bold text-gray-800 dark:text-white mb-1">כניסת בעלי מגרשים</h1>
            <p id="subtitleText" class="text-xs text-gray-400 dark:text-gray-500 mb-6">הקלד את מספר הטלפון שלך לקבלת קוד אימות בטרמינל</p>

            <form id="phoneForm" class="space-y-4">
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">מספר טלפון נייד:</label>
                    <input type="tel" id="phoneInput" required placeholder="050-0000000" class="w-full px-4 py-3 text-center text-lg rounded-2xl border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 font-mono">
                </div>
                
                <div id="phoneErrorMsg" class="text-red-500 text-xs hidden"></div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-2xl transition text-xs shadow-sm cursor-pointer">
                    שלח קוד אימות לטרמינל <i class="fa-solid fa-arrow-left mr-1"></i>
                </button>
            </form>

            <form id="pinForm" class="space-y-4 hidden">
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">הקלד את קוד 8 הספרות מהטרמינל:</label>
                    <input type="password" id="pinInput" maxlength="8" required placeholder="• • • • • • • •" class="w-full px-4 py-3 text-center tracking-widest text-lg rounded-2xl border border-gray-200 dark:border-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 font-mono">
                </div>
                
                <div id="pinErrorMsg" class="text-red-500 text-xs hidden"></div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-3 rounded-2xl transition text-xs shadow-sm cursor-pointer">
                    אמת קוד והכנס למערכת <i class="fa-solid fa-arrow-left mr-1"></i>
                </button>
                <button type="button" onclick="location.reload()" class="w-full text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 text-xs py-1">
                    הזן מספר טלפון מחדש
                </button>
            </form>

            <div class="mt-6 border-t border-gray-100 dark:border-gray-800 pt-4 text-center">
                <p class="text-xs text-gray-500 dark:text-gray-400">אין לך עדיין מגרש רשום במערכת?</p>
                <button onclick="openRegisterModal()" class="mt-1 text-xs text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 font-semibold transition cursor-pointer">
                    <i class="fa-solid fa-user-plus ml-1"></i> הירשם כבעל מגרש חדש
                </button>
            </div>
        </div>
    </main>

    <!-- מודל אדמין -->
    <div id="adminModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center px-4 z-50">
        <div class="bg-white dark:bg-gray-900 max-w-md w-full p-6 rounded-3xl shadow-lg relative border dark:border-gray-800">
            <button onclick="closeAdminModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-gray-900 text-white dark:bg-gray-800 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800 dark:text-white">התחברות מנהל ראשי (אדמין)</h2>
                <p class="text-xs text-gray-400">גישה מלאה למבט-על על כל מגרשי הרכבים והנתונים</p>
            </div>
            <form id="adminForm" class="space-y-4">
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">שם משתמש:</label>
                    <input type="text" id="adminUser" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">סיסמה:</label>
                    <input type="password" id="adminPass" required class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-gray-900 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                </div>
                <div id="adminErrorMsg" class="text-red-500 text-xs hidden"></div>
                <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 dark:bg-gray-100 dark:text-gray-900 dark:hover:bg-gray-200 text-white py-3 rounded-xl text-xs font-medium transition shadow-sm cursor-pointer">
                    התחבר כמנהל ראשי
                </button>
            </form>
        </div>
    </div>

    <!-- מודל רישום מגרש -->
    <div id="registerModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center px-4 z-50">
        <div class="bg-white dark:bg-gray-900 max-w-md w-full p-6 rounded-3xl shadow-lg relative border dark:border-gray-800">
            <button onclick="closeRegisterModal()" class="absolute top-4 left-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-store"></i>
                </div>
                <h2 class="text-lg font-bold text-gray-800 dark:text-white">הרשמת בעל מגרש חדש</h2>
                <p class="text-xs text-gray-400">הכנס את פרטי העסק שלך לפתיחת חשבון במערכת</p>
            </div>
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">שם העסק / מגרש הרכבים:</label>
                    <input type="text" id="regDealerName" required placeholder="למשל: אוטו-דיל צפון" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">שם איש קשר:</label>
                    <input type="text" id="regContactName" required placeholder="שם מלא" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                </div>
                <div>
                    <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">מספר טלפון נייד:</label>
                    <input type="tel" id="regPhone" required placeholder="050-0000000" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 font-mono">
                </div>
                <div id="regErrorMsg" class="text-red-500 text-xs hidden"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-xl text-xs font-medium transition shadow-sm cursor-pointer">
                    שלח בקשת רישום והפק קוד
                </button>
            </form>
        </div>
    </div>

    <script>
        let savedPhone = '';

        // ניהול מצב כהה/בהיר
        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (icon && text) {
                if (isDark) {
                    icon.className = 'fa-solid fa-sun';
                    text.innerText = 'מצב בהיר';
                } else {
                    icon.className = 'fa-solid fa-moon';
                    text.innerText = 'מצב כהה';
                }
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeUI();
        }

        window.addEventListener('DOMContentLoaded', updateThemeUI);

        // מודלים
        function openAdminModal() { document.getElementById('adminModal').classList.remove('hidden'); document.getElementById('adminModal').classList.add('flex'); }
        function closeAdminModal() { document.getElementById('adminModal').classList.add('hidden'); document.getElementById('adminModal').classList.remove('flex'); }

        function openRegisterModal() { document.getElementById('registerModal').classList.remove('hidden'); document.getElementById('registerModal').classList.add('flex'); }
        function closeRegisterModal() { document.getElementById('registerModal').classList.add('hidden'); document.getElementById('registerModal').classList.remove('flex'); }

        // לוגיקת טפסים
        document.getElementById('phoneForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            savedPhone = document.getElementById('phoneInput').value;
            const errorDiv = document.getElementById('phoneErrorMsg');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/dealer/request-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: savedPhone })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('phoneForm').classList.add('hidden');
                    document.getElementById('pinForm').classList.remove('hidden');
                    document.getElementById('subtitleText').innerText = `הקוד הופק בטרמינל עבור ${savedPhone}. הקלד אותו כאן:`;
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'שגיאת תקשורת מול השרת.';
                errorDiv.classList.remove('hidden');
            }
        });

        document.getElementById('pinForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pin = document.getElementById('pinInput').value;
            const errorDiv = document.getElementById('pinErrorMsg');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/dealer/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: savedPhone, pin })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('isDealerAuthenticated', 'true');
                    sessionStorage.removeItem('isAdminAuthenticated');
                    window.location.href = 'dealer-dashboard.html';
                } else {
                    errorDiv.innerText = data.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'שגיאת תקשורת מול השרת.';
                errorDiv.classList.remove('hidden');
            }
        });

        document.getElementById('adminForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('adminUser').value;
            const password = document.getElementById('adminPass').value;
            const errorDiv = document.getElementById('adminErrorMsg');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('isAdminAuthenticated', 'true');
                    sessionStorage.removeItem('isDealerAuthenticated');
                    window.location.href = 'dealer-dashboard.html';
                } else {
                    errorDiv.innerText = data.message || 'פרטי אדמין שגויים';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'שגיאת תקשורת מול השרת.';
                errorDiv.classList.remove('hidden');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const dealerName = document.getElementById('regDealerName').value;
            const contactName = document.getElementById('regContactName').value;
            const phone = document.getElementById('regPhone').value;
            const errorDiv = document.getElementById('regErrorMsg');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/dealer/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dealerName, contactName, phone })
                });
                const data = await res.json();
                if (data.success) {
                    alert('נרשמת בהצלחה! קוד אימות הופק בטרמינל.');
                    closeRegisterModal();
                    document.getElementById('phoneInput').value = phone;
                } else {
                    errorDiv.innerText = data.message || 'שגיאה ברישום';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'שגיאת תקשורת מול השרת.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
