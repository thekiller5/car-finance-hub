<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות מנהל ראשי - Car Finance Hub</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; direction: rtl; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; font-size: 14px; color: #333; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background-color: #e74c3c; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { background-color: #c0392b; }
        #errorMessage { color: #e74c3c; text-align: center; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>ניהול ראשי (Admin)</h2>
        <form id="adminLoginForm">
            <div class="form-group">
                <label for="username">שם משתמש:</label>
                <input type="text" id="username" required placeholder="הכנס שם משתמש">
            </div>
            <div class="form-group">
                <label for="password">סיסמה:</label>
                <input type="password" id="password" required placeholder="הכנס סיסמה">
            </div>
            <button type="submit" class="btn">התחבר כמנהל</button>
        </form>
        <div id="errorMessage"></div>
    </div>

    <script>
        document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    window.location.href = '/dealer-dashboard.html';
                } else {
                    errorDiv.textContent = data.message || 'שם משתמש או סיסמה שגויים.';
                }
            } catch (error) {
                errorDiv.textContent = 'שגיאה בהתחברות לשרת.';
            }
        });
    </script>
</body>
</html>
