<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>קטלוג רכבים - Car Finance Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col justify-between">

    <!-- סרגל עליון ראשي המאפשר גישה מהירה לעמוד ההתחברות והניהול -->
    <header class="bg-gray-900 text-white py-2.5 px-6 shadow-md flex justify-between items-center text-xs sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-car text-blue-400 text-base"></i>
            <span class="font-bold text-sm tracking-wide">Car Finance Hub</span>
            <span class="bg-gray-800 text-gray-300 px-2 py-0.5 rounded text-[10px] mr-2">קטלוג ציבורי</span>
        </div>
        <a href="dealer-login.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl transition font-medium flex items-center gap-1.5 shadow-sm cursor-pointer">
            <i class="fa-solid fa-lock text-xs"></i> אזור אישי / כניסת סוכנים ומנהלים
        </a>
    </header>

    <!-- תוכן ראשי -->
    <div class="max-w-6xl mx-auto py-10 px-4 flex-1 w-full">
        
        <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-3xl shadow-sm border border-gray-100 mb-8 gap-4">
            <div>
                <h1 id="dealershipTitle" class="text-2xl font-bold text-gray-800">קטלוג רכבים למכירה</h1>
                <p class="text-xs text-gray-400 mt-1">בחר את הרכב המושלם עבורך והגש בקשת מימון או טרייד-אין בקלות</p>
            </div>
            <div class="flex items-center gap-3">
                <a href="client-sign.html" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2.5 rounded-xl font-medium transition shadow-sm">
                    <i class="fa-solid fa-file-signature ml-1"></i> טופס בקשת מימון פתוח
                </a>
                <!-- כפתור נוסף מהיר לעמוד ההתחברות המרכזי -->
                <a href="dealer-login.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs px-4 py-2.5 rounded-xl font-medium transition">
                    <i class="fa-solid fa-lock ml-1"></i> כניסת סוכנים
                </a>
            </div>
        </div>

        <!-- אזור סינון וחיפוש מתקדם -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">חיפוש חופשי (דגם, צבע...)</label>
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="למשל: מרצדס, לבן..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs">
                    <i class="fa-solid fa-search absolute left-3 top-3 text-gray-400 text-xs"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">סינון לפי מחיר מקסימלי</label>
                <select id="priceFilter" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-white">
                    <option value="all">הכל (ללא הגבלה)</option>
                    <option value="100000">עד 100,000 ₪</option>
                    <option value="150000">עד 150,000 ₪</option>
                    <option value="250000">עד 250,000 ₪</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1">סינון לפי שנת ייצור</label>
                <select id="yearFilter" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-xs bg-white">
                    <option value="all">כל השנים</option>
                    <option value="2024">2024 ומעלה</option>
                    <option value="2023">2023</option>
                    <option value="2022">2022 ומטה</option>
                </select>
            </div>
        </div>

        <div id="carsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <p class="text-gray-400 text-xs col-span-3 text-center py-10">טוען רכבים מהמלאי...</p>
        </div>

    </div>

    <!-- פוטר (Footer) -->
    <footer class="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-400 mt-12">
        <p>Car Finance Hub &copy; 2026 - כל הזכויות שמורות</p>
    </footer>

    <script>
        let allCars = [];
        let dealershipProfile = { whatsappNumber: '0500000000', dealershipName: 'אוטו סנטר הצפון' };

        async function fetchCatalogData() {
            try {
                const profileRes = await fetch('http://localhost:3000/api/dealer/profile');
                const profileData = await profileRes.json();
                if (profileData.success) {
                    dealershipProfile = profileData.profile;
                    document.getElementById('dealershipTitle').innerText = `קטלוג רכבים - ${dealershipProfile.dealershipName}`;
                }

                const carsRes = await fetch('http://localhost:3000/api/cars');
                const carsData = await carsRes.json();
                if (carsData.success) {
                    allCars = carsData.cars;
                    renderCars(allCars);
                }
            } catch (err) {
                console.error('שגיאה בטעינת נתונים לקטלוג:', err);
                document.getElementById('carsGrid').innerHTML = '<p class="text-red-500 text-xs col-span-3 text-center">שגיאה בטעינת הנתונים מהשרת.</p>';
            }
        }

        function renderCars(carsToDisplay) {
            const grid = document.getElementById('carsGrid');
            grid.innerHTML = '';

            if (carsToDisplay.length === 0) {
                grid.innerHTML = '<p class="text-gray-400 text-xs col-span-3 text-center py-10">לא נמצאו רכבים העונים על תנאי החיפוש.</p>';
                return;
            }

            carsToDisplay.forEach(car => {
                const cleanPhone = dealershipProfile.whatsappNumber.replace(/-/g, '').replace(/^0/, '972');
                const whatsappMsg = encodeURIComponent(`שלום, אני מעוניין לקבל פרטים נוספים ובדיקת מימון על הרכב: ${car.model} (${car.year}) שעולה ${car.price}.`);
                const whatsappUrl = `https://wa.me/${cleanPhone}?text=${whatsappMsg}`;

                grid.innerHTML += `
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden flex flex-col justify-between transition hover:shadow-md">
                        <div>
                            <img src="${car.image}" alt="${car.model}" class="w-full h-48 object-cover">
                            <div class="p-5">
                                <div class="flex justify-between items-start mb-2">
                                    <h3 class="font-bold text-gray-800 text-base">${car.model}</h3>
                                    <span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-lg font-bold">${car.price}</span>
                                </div>
                                <p class="text-xs text-gray-400 mb-4">${car.notes || 'רכב שמור ומטופל במצב מעולה.'}</p>
                                
                                <div class="grid grid-cols-2 gap-2 text-xs text-gray-600 bg-gray-50 p-3 rounded-2xl mb-4 border border-gray-100">
                                    <div><i class="fa-solid fa-calendar text-blue-500 ml-1"></i> שנה: <strong>${car.year}</strong></div>
                                    <div><i class="fa-solid fa-gauge text-blue-500 ml-1"></i> קילומטראז': <strong>${car.km}</strong></div>
                                    <div><i class="fa-solid fa-gears text-blue-500 ml-1"></i> גיר: <strong>${car.gear}</strong></div>
                                    <div><i class="fa-solid fa-palette text-blue-500 ml-1"></i> צבע: <strong>${car.color}</strong></div>
                                </div>
                            </div>
                        </div>

                        <div class="p-5 pt-0 flex flex-col gap-2">
                            <a href="${whatsappUrl}" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-xl transition text-xs text-center shadow-xs flex items-center justify-center gap-1.5">
                                <i class="fa-brands fa-whatsapp text-sm"></i> שוחח עם סוכן בוואטסאפ
                            </a>
                            <a href="client-sign.html?carId=${car.id}" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-xl transition text-xs text-center shadow-xs">
                                הגש בקשת מימון לרכב זה <i class="fa-solid fa-arrow-left mr-1"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filterCars() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const maxPrice = document.getElementById('priceFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;

            const filtered = allCars.filter(car => {
                const matchesSearch = car.model.toLowerCase().includes(searchTerm) || 
                                    (car.color && car.color.toLowerCase().includes(searchTerm)) ||
                                    (car.notes && car.notes.toLowerCase().includes(searchTerm));
                
                let matchesYear = true;
                const carYearNum = parseInt(car.year);
                if (yearFilter === '2024') matchesYear = carYearNum >= 2024;
                else if (yearFilter === '2023') matchesYear = carYearNum === 2023;
                else if (yearFilter === '2022') matchesYear = carYearNum <= 2022;

                let matchesPrice = true;
                if (maxPrice !== 'all') {
                    const numericPrice = parseInt(car.price.replace(/[^\d]/g, ''));
                    matchesPrice = numericPrice <= parseInt(maxPrice);
                }

                return matchesSearch && matchesYear && matchesPrice;
            });

            renderCars(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterCars);
        document.getElementById('priceFilter').addEventListener('change', filterCars);
        document.getElementById('yearFilter').addEventListener('change', filterCars);

        window.addEventListener('DOMContentLoaded', fetchCatalogData);
    </script>

</body>
</html>
