<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול פרופיל בעל מגרש - מערכת מימון רכבים</title>
    <!-- טעינת Tailwind CSS לעיצוב מהיר ומודרני -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">

    <div class="max-w-2xl mx-auto my-10 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">הגדרות פרופיל בעל מגרש</h1>
            <p class="text-gray-500 text-sm mt-1">הזן את פרטי העסק שלך כדי שיוצגו ללקוחות באפליקציה</p>
        </div>

        <form id="dealerForm" class="space-y-6">
            
            <!-- פרטים עסקיים -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שם המגרש / העסק</label>
                    <input type="text" id="dealershipName" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: אוטו סנטר הצפון">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">שם איש קשר / סוכן</label>
                    <input type="text" id="contactName" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: מועאד חטיב">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">מספר טלפון לוואטסאפ</label>
                    <input type="tel" id="whatsappNumber" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="למשל: 0501234567">
                    <p class="text-xs text-gray-400 mt-1">למספר זה יגיעו הפניות מהלקוחות</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ח.פ / עוסק מורשה</label>
                    <input type="text" id="taxId" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="מספר חברה או עוסק">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">כתובת פיזית של המגרש</label>
                <input type="text" id="address" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="עיר, רחוב ומספר בית">
            </div>

            <!-- חברות מימון מועדפות -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">חברות מימון ובנקים שאתה עובד איתם</label>
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    <label class="flex items-center space-x-2 space-x-reverse p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="financing" value="Cal" class="rounded text-blue-600">
                        <span class="text-sm font-medium text-gray-700">כאל (Cal)</span>
                    </label>
                    <label class="flex items-center space-x-2 space-x-reverse p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="financing" value="Max" class="rounded text-blue-600">
                        <span class="text-sm font-medium text-gray-700">מקס (Max)</span>
                    </label>
                    <label class="flex items-center space-x-2 space-x-reverse p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="financing" value="Leumi" class="rounded text-blue-600">
                        <span class="text-sm font-medium text-gray-700">לאומי קארד / פሪים</span>
                    </label>
                    <label class="flex items-center space-x-2 space-x-reverse p-3 border rounded-xl cursor-pointer hover:bg-gray-50">
                        <input type="checkbox" name="financing" value="External" class="rounded text-blue-600">
                        <span class="text-sm font-medium text-gray-700">מימון חוץ-בנקאי</span>
                    </label>
                </div>
            </div>

            <!-- כפתור שמירה -->
            <div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md">
                    שמור פרופיל והמשך לניהול רכבים
                </button>
            </div>

        </form>
    </div>

    <script>
        // דוגמה פשוטה לקליטת הנתונים בלחיצה על שמירה
        document.getElementById('dealerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const dealershipName = document.getElementById('dealershipName').value;
            const whatsappNumber = document.getElementById('whatsappNumber').value;
            
            // איסוף חברות המימון שנבחרו
            const selectedFinancing = [];
            document.querySelectorAll('input[name="financing"]:checked').forEach((checkbox) => {
                selectedFinancing.push(checkbox.value);
            });

            alert(`הפרטים נשמרו בהצלחה עבור המגרש: ${dealershipName}!\nמספר וואטסאפ לעדכון: ${whatsappNumber}`);
            
            // כאן בהמשך נחבר את זה למסד נתונים או שרת (Node.js/Python)
        });
    </script>

</body>
</html>
