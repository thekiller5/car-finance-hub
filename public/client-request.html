<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טופס בקשת מימון - Car Finance Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col justify-between transition-colors duration-200">

    <header class="w-full p-4 flex justify-between items-center max-w-3xl mx-auto">
        <a href="index.html" class="text-xs text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition flex items-center gap-1">
            <i class="fa-solid fa-arrow-right"></i> חזרה לקטלוג הרכבים
        </a>
        <button onclick="toggleDarkMode()" class="bg-gray-200 dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-3 py-2 rounded-xl text-xs font-medium transition shadow-sm flex items-center gap-1.5 cursor-pointer">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
            <span id="themeText">מצב כהה</span>
        </button>
    </header>

    <main class="flex items-center justify-center px-4 flex-1 py-6">
        <div class="max-w-xl w-full bg-white dark:bg-gray-900 p-8 rounded-3xl shadow-sm border border-gray-100 dark:border-gray-800 transition-colors duration-200">
            
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-50 dark:bg-blue-950 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-file-invoice-dollar"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800 dark:text-white">טופס בקשת מימון מהיר</h1>
                <p class="text-xs text-gray-400 mt-1">מלא את הפרטים ובחר את אחוז המימון הרצוי לקבלת תשובה מיידית</p>
            </div>

            <!-- תצוגת פרטי הרכב הנבחר -->
            <div id="carInfoBox" class="bg-blue-50/50 dark:bg-blue-950/40 border border-blue-100 dark:border-blue-900/50 rounded-2xl p-4 mb-6 flex justify-between items-center">
                <div>
                    <span class="text-[11px] text-blue-600 dark:text-blue-400 font-bold block mb-0.5">רכב נבחר לבדיקת מימון:</span>
                    <h3 id="selectedCarModel" class="font-bold text-sm text-gray-800 dark:text-white">-</h3>
                </div>
                <div class="text-left">
                    <span class="text-[11px] text-gray-400 block mb-0.5">מחיר הרכב:</span>
                    <span id="selectedCarPrice" class="font-mono font-bold text-base text-blue-600 dark:text-blue-400">-</span>
                </div>
            </div>

            <form id="financeRequestForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">שם מלא:</label>
                        <input type="text" id="clientName" required placeholder="ישראל ישראלי" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                    </div>
                    <div>
                        <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">תעודת זהות:</label>
                        <input type="text" id="clientIdNumber" maxlength="9" required placeholder="123456789" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 font-mono">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">מספר טלפון נייד:</label>
                        <input type="tel" id="clientPhone" required placeholder="050-0000000" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 font-mono">
                    </div>
                    <div>
                        <label class="block text-right text-xs font-medium text-gray-600 dark:text-gray-300 mb-1">גוף מימון מבוקש:</label>
                        <select id="financeProvider" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100">
                            <option value="לאומי קארד">לאומי קארד</option>
                            <option value="מיካ">מיכי (מימון ישיר)</option>
                            <option value="פועלים אקספרס">פועלים אקספרס</option>
                            <option value="כאל">כאל מימון</option>
                        </select>
                    </div>
                </div>

                <!-- בחירת אחוז מימון דינמית -->
                <div class="bg-gray-50 dark:bg-gray-800/50 p-4 rounded-2xl border border-gray-100 dark:border-gray-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="text-xs font-medium text-gray-700 dark:text-gray-300">בחר אחוז מימון מבוקש:</label>
                        <span id="financePercentLabel" class="font-bold text-sm text-blue-600 dark:text-blue-400 font-mono">100%</span>
                    </div>
                    <input type="range" id="financePercentRange" min="30" max="100" step="5" value="100" class="w-full accent-blue-600 cursor-pointer" oninput="calculateFinanceAmount()">
                    
                    <div class="flex justify-between items-center text-xs pt-1 border-t border-gray-200 dark:border-gray-700">
                        <span class="text-gray-400">סכום המימון המחושב:</span>
                        <span id="calculatedAmount" class="font-bold font-mono text-sm text-gray-800 dark:text-white">₪0</span>
                    </div>
                </div>

                <div id="formErrorMsg" class="text-red-500 text-xs hidden text-center"></div>

                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-2xl transition text-xs shadow-sm cursor-pointer flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-check-circle"></i> שלח בקשה והרץ בדיקת אשראי מיידית
                </button>
            </form>

            <!-- אזור תוצאה לאחר שליחה -->
            <div id="resultBox" class="hidden text-center py-6 space-y-4">
                <div id="resultIconContainer" class="w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-2xl"></div>
                <h2 id="resultTitle" class="text-lg font-bold"></h2>
                <p id="resultDesc" class="text-xs text-gray-500 dark:text-gray-400 max-w-sm mx-auto"></p>
                <a href="index.html" class="inline-block bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200 px-6 py-2.5 rounded-xl text-xs font-medium transition">
                    חזרה לקטלוג הרכבים
                </a>
            </div>

        </div>
    </main>

    <script>
        let rawCarPrice = 0;

        function updateThemeUI() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('themeIcon');
            const text = document.getElementById('themeText');
            if (icon && text) {
                if (isDark) {
                    icon.className = 'fa-solid fa-sun';
                    text.innerText = 'מצב בהיר';
                } else {
                    icon.className = 'fa-solid fa-moon';
                    text.innerText = 'מצב כהה';
                }
            }
        }

        function toggleDarkMode() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
            updateThemeUI();
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateThemeUI();

            // קליטת פרטי הרכב מה-URL
            const urlParams = new URLSearchParams(window.location.search);
            const carModel = urlParams.get('car') || 'רכב כללי לבדיקת מימון';
            const carPriceStr = urlParams.get('price') || '₪100,000';

            document.getElementById('selectedCarModel').innerText = carModel;
            document.getElementById('selectedCarPrice').innerText = carPriceStr;

            // המרת המחיר למספר לצורך חישוב האחוזים (מנקה סימני מטבע ופסיקים)
            rawCarPrice = parseInt(carPriceStr.replace(/[^0-9]/g, '')) || 100000;
            calculateFinanceAmount();
        });

        function calculateFinanceAmount() {
            const percent = document.getElementById('financePercentRange').value;
            document.getElementById('financePercentLabel').innerText = percent + '%';
            
            const calculated = Math.round((rawCarPrice * percent) / 100);
            document.getElementById('calculatedAmount').innerText = '₪' + calculated.toLocaleString();
        }

        document.getElementById('financeRequestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('clientName').value;
            const idNumber = document.getElementById('clientIdNumber').value;
            const phone = document.getElementById('clientPhone').value;
            const financeProvider = document.getElementById('financeProvider').value;
            const percent = document.getElementById('financePercentRange').value;
            const requestType = `מימון רכב (${percent}%) - ${document.getElementById('selectedCarModel').innerText}`;
            
            const errorDiv = document.getElementById('formErrorMsg');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/client/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, idNumber, phone, requestType, financeProvider })
                });

                const data = await res.json();
                if (res.ok && data.success) {
                    // הסתרת הטופס והצגת תוצאה
                    document.getElementById('financeRequestForm').classList.add('hidden');
                    document.getElementById('carInfoBox').classList.add('hidden');
                    
                    const resultBox = document.getElementById('resultBox');
                    resultBox.classList.remove('hidden');

                    const iconContainer = document.getElementById('resultIconContainer');
                    const title = document.getElementById('resultTitle');
                    const desc = document.getElementById('resultDesc');

                    // בדיקה מהתוצאה שחזרה מהשרת האם האשראי אושר או נכשל
                    // (השרת מחזיר רשימה או סטטוס, נציג הודעה מותאמת)
                    iconContainer.className = "w-16 h-16 rounded-2xl flex items-center justify-center mx-auto text-2xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-400";
                    iconContainer.innerHTML = '<i class="fa-solid fa-check"></i>';
                    title.innerText = 'הבקשה נקלטה והאישור העקרוני עבר בהצלחה!';
                    title.className = 'text-lg font-bold text-emerald-600 dark:text-emerald-400';
                    desc.innerText = 'פרטי הבקשה שלך הועברו לטיפול סוכן המגרש והאדמין. נציג יצור איתך קשר בהקדם להשלמת חתימה והעלאת צילום תעודת זהות.';
                } else {
                    errorDiv.innerText = data.message || 'שגיאה בשליחת הטופס';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = 'שגיאת תקשורת מול השרת.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
