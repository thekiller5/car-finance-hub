<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הרשמת בעל מגרש/סוכן - Car Finance Hub</title>
    <!-- טעינת Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans flex items-center justify-center min-h-screen py-12 px-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-sm border border-gray-100 p-8">
        <!-- כותרת -->
        <div class="text-center mb-8">
            <div class="bg-blue-600 text-white w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-sm text-xl">
                <i class="fa-solid fa-store"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">הצטרפות כבעל מגרש</h1>
            <p class="text-xs text-gray-400 mt-1">הקם את המערכת הדיגיטלית שלך לניהול רכבים ומימון לקוחות</p>
        </div>

        <!-- טופס הרשמה -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1.5">שם המגרש / העסק</label>
                <input type="text" id="dealershipName" required placeholder="למשל: אוטו סנטר הצפון" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1.5">שם איש קשר / סוכן</label>
                <input type="text" id="contactName" required placeholder="שם מלא" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1.5">מספר וואטסאפ לקבלת פניות</label>
                <input type="text" id="whatsappNumber" required placeholder="050-0000000" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1.5">ח.פ או תעודת זהות</label>
                <input type="text" id="taxId" placeholder="מספר רישום עסקי" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-medium text-gray-700 mb-1.5">כתובת המגרש</label>
                <input type="text" id="address" placeholder="עיר, רחוב" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl transition shadow-sm text-sm mt-2">
                הירשם והתחל לנהל מגרש <i class="fa-solid fa-arrow-left mr-1"></i>
            </button>
        </form>

        <!-- מעבר לכניסה -->
        <div class="text-center mt-6 pt-4 border-t border-gray-100">
            <p class="text-xs text-gray-500">כבר רשום במערכת? <a href="dealer-login.html" class="text-blue-600 font-medium hover:underline">התחבר כאן</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const dealerData = {
                dealershipName: document.getElementById('dealershipName').value,
                contactName: document.getElementById('contactName').value,
                whatsappNumber: document.getElementById('whatsappNumber').value,
                taxId: document.getElementById('taxId').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('http://localhost:3000/api/dealer/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dealerData)
                });

                const result = await response.json();

                if (result.success) {
                    alert('הרישום בוצע בהצלחה! מעבר לדשבורד הניהול...');
                    window.location.href = 'dealer-dashboard.html';
                } else {
                    alert('שגיאה ברישום: ' + result.message);
                }
            } catch (error) {
                console.error('שגיאת תקשורת:', error);
                alert('לא ניתן להתחבר לשרת.');
            }
        });
    </script>
</body>
</html>
